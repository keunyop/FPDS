[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fpds-worker"
version = "0.1.0"
description = "FPDS worker pipeline baseline for discovery, snapshot, parsing, and chunking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "cryptography>=3.1",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "uvicorn>=0.30,<1",
]

[tool.vercel]
entrypoint = "app:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["worker*"]
