<html><head><title>Fairstone Unsecured Loans: Fast, Low Interest Personal Loan</title></head><body><h1 class="hbs-title">
                Unsecured loans – no collateral required
            </h1><fs-navigation-column aem-data='{"id":"id-AE16E016CCB611DDD30BF2BBCBFA79956D9BE09F1874B0F3D76D3075C85D0E9C","title":"Loans","items":[{"text":"Loans overview","id":"id-AE16E016CCB611DDD30BF2BBCBFA79956D9BE09F1874B0F3D76D3075C85D0E9C","type":"internal","url":"/en/loans/personal-loans"},{"text":"Secured personal loans","id":"id-AE16E016CCB611DDD30BF2BBCBFA79956D9BE09F1874B0F3D76D3075C85D0E9C","type":"internal","url":"/en/loans/secured-loans"},{"text":"Unsecured personal loans","id":"id-AE16E016CCB611DDD30BF2BBCBFA79956D9BE09F1874B0F3D76D3075C85D0E9C","type":"internal","url":"/en/loans/unsecured-loans"},{"text":"Car and auto loans","id":"id-AE16E016CCB611DDD30BF2BBCBFA79956D9BE09F1874B0F3D76D3075C85D0E9C","type":"internal","url":"/en/loans/auto-loans"},{"text":"Online loans","id":"id-AE16E016CCB611DDD30BF2BBCBFA79956D9BE09F1874B0F3D76D3075C85D0E9C","type":"internal","url":"/en/loans/online-loans"}]}'></fs-navigation-column><fs-text aem-data='{"size":"body","textIsRich":"true","id":"id-4D15749E46D0454872A0F61AEBCC3C464992B8B5E8F87FCE767DC44C219D97AA","content":"\u003cp\u003e*Automatic entry to Contest by taking out a qualifying personal loan (excludes mortgage loans) is not open to residents of Manitoba and Newfoundland \u0026amp; Labrador. Contest terms and conditions apply. No purchase necessary. Contest is open to legal residents of Canada who are the age of majority in the province or territory in which they reside. Entrants must be the primary account holder of an unsecured personal loan or secured personal loan (excludes mortgages). The loan must be disbursed by September 25, 2026.\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003eLimit of one (1) entry per eligible loan.\u003c/li\u003e\r\n\u003cli\u003eTwenty (20) prizes to be awarded of one (1) $1,000 CAD cash prize.\u003c/li\u003e\r\n\u003cli\u003eThe prize will be payable by cheque. The winner may choose to apply the cheque to their Fairstone loan.\u003c/li\u003e\r\n\u003cli\u003eWinner will be selected by random draw based on geographic area and there will be five winners per area (Western Canada, Ontario, Quebec, Atlantic Canada)\u003c/li\u003e\r\n\u003cli\u003eContest period runs from September 8, 2026 at 12:01:01 a.m. Eastern Time until September 25, 2026 at 11:59:59 p.m. Eastern Time.\u003c/li\u003e\r\n\u003cli\u003ePrize draw on October 14, 2026, and prizes distributed between November 9-27, 2026.\u003c/li\u003e\r\n\u003cli\u003eLoan must be open, active and in good standing at the time of the prize draw and prize distribution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eOdds of winning will depend on the number of eligible entries received by the contest deadline. Correct answer to mathematical skill-testing question required. Fairstone reserves the right to discontinue the contest at any time for any reason.\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eFor full contest rules, and to apply with no purchase necessary, visit \u003ca href\u003d\"/en/about/promotions/break-up-with-your-debt-rules.html\" aria-label\u003d\"Official Contest Rules\" title\u003d\"Official Contest Rules\"\u003ehttps://fairstone.ca/en/about/promotions/break-up-with-your-debt-rules\u003c/a\u003e\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eLoan offers are only valid if you meet our current credit standards. Offers provided to users who complete a loan quote are for an unsecured personal loan only.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eUnsecured personal loans:\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eInterest Rates on unsecured personal loans range from 29.99%-34.99%, with a minimum loan term of 6 months and maximum term of 60 months. Your actual Annual Percentage Rate (APR) will vary based on province of residence and individual factors like the details of your credit report and loan amount.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eAn example of a $10,000 unsecured personal loan: APR of 34.99%, 60-month term, monthly payment of $354.84 including principal and interest.\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eFairstone Financial Inc. holds high-cost credit grantor licenses in AB, MB and QC; it has applied for high-cost credit grantor licenses in NL. For license information by province, visit \u003ca href\u003d\"/en/legal/high-cost-credit-license.html\" title\u003d\"High-cost credit licensing information\"\u003ewww.Fairstone.ca/HCCG\u003c/a\u003e.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eFor NL and MB residents: Annual interest rates on unsecured personal loans range from 29.99%-34.99%.\u0026nbsp; A non-sufficient funds (NSF) charge of $45 may be applied to returned payments due to non-sufficient funds.\u0026nbsp; If you incur two NSFs within a three-month period or three NSFs within a 12-month period, in addition to the charge of $45 that may be applied to each NSF and until the situation is rectified, (i) you will no longer be able to make your payments by way of pre-authorized debits and (ii) the repayment will be restricted to payments by debit card, phone payments with your local branch, online banking payments through your financial institution, cash and certified cheque.\u0026nbsp; An unsecured personal loan may be cancelled within 14 days of signing the agreement, in accordance with High-Cost Credit legislation in each of these provinces.\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eSecured personal loans and mortgages:\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eInterest Rates on secured personal loans range from 19.99%-25.99%, with a minimum loan term of 36 months and a maximum term of 120 months. Interest Rates on mortgage loans range from 14.99%-20.25%, with a minimum loan term of 12 months and a maximum term of 60 months, and amortization periods up to 25 years. Your actual APR will vary based on individual factors including province/territory, the details of your credit report and financial situation, loan type and services provided in order to secure the loan including administration fee, appraisal fee, title fee and solicitor/notary fee. All fees are included in your loan contract and explained to you by our Lending Specialists.\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eAn example of a $40,000 secured personal loan: APR 23.26%, 120-month term, monthly payment of $861 including principal and interest.\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eAn example of a $90,000 mortgage: APR 18.94%, 60-month term, 20 years amortization, monthly payment of $1,371 including principal and interest.\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eFairstone Financial Inc. is a provider of personal loans and mortgages and is headquartered at 630 René-Lévesque Blvd W, Montreal, Quebec H3B 1S6, Telephone Number 800-995-2274.\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp\u003eIn Ontario, Fairstone Financial Inc. is licensed as mortgage brokerage #10821. In Nova Scotia, Fairstone Financial Inc. is licensed as mortgage lender #2021-3000028. In Manitoba, Fairstone Financial Inc. is licensed as a high-cost credit grantor, license number #85047 (expiry date 20-02-2026).\u0026nbsp;\u003c/p\u003e\r\n"}'></fs-text><fs-navigation-column aem-data='{"id":"id-5EB4F680A414ED7144F2A63D01F0E376706535258A892C957E8038B59F7E0321","title":"Personal Loans","items":[{"text":"Loans overview","id":"id-5EB4F680A414ED7144F2A63D01F0E376706535258A892C957E8038B59F7E0321","type":"internal","url":"/en/loans/personal-loans"},{"text":"Secured personal loans","id":"id-5EB4F680A414ED7144F2A63D01F0E376706535258A892C957E8038B59F7E0321","type":"internal","url":"/en/loans/secured-loans"},{"text":"Unsecured personal loans","id":"id-5EB4F680A414ED7144F2A63D01F0E376706535258A892C957E8038B59F7E0321","type":"internal","url":"/en/loans/unsecured-loans"},{"text":"Car and auto loans","id":"id-5EB4F680A414ED7144F2A63D01F0E376706535258A892C957E8038B59F7E0321","type":"internal","url":"/en/loans/auto-loans"},{"text":"Online loans","id":"id-5EB4F680A414ED7144F2A63D01F0E376706535258A892C957E8038B59F7E0321","type":"internal","url":"/en/loans/online-loans"}]}'></fs-navigation-column></body></html>
